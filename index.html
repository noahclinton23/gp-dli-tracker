<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HEART AND DRIVE EFFICIENCY</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg: #0b1220;
      --panel: #0f172a;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted:#9ca3af;

      --inBlueBg: rgba(59, 130, 246, 0.22);   /* blue highlight */
      --inBlueBorder: rgba(59, 130, 246, 0.55);
      --inBlueText: #dbeafe;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #0f172a, #050814 70%);
      color: var(--text);
      padding: 14px;
    }

    .app{
      max-width: 1100px;
      margin: 0 auto;
      border: 1px solid var(--border);
      background: rgba(2,6,23,0.65);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    }

    .topbar{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    h1{
      font-size: 1.15rem;
      margin: 0;
      letter-spacing: .02em;
    }
    .sub{
      margin: 4px 0 0;
      font-size: .82rem;
      color: var(--muted);
    }

    .hint{
      font-size: .82rem;
      color: var(--muted);
      text-align:right;
      line-height: 1.35;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .card{
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(15,23,42,0.75);
      overflow:hidden;
    }

    .cardHeader{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding: 10px 10px 8px;
      border-bottom: 1px solid var(--border);
      background: rgba(2,6,23,0.55);
    }

    .cardHeader h2{
      margin:0;
      font-size: .92rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .pill{
      font-size: .72rem;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(2,6,23,0.4);
    }

    table{
      width:100%;
      border-collapse: collapse;
      font-size: .92rem;
    }
    th, td{
      padding: 10px 10px;
      border-bottom: 1px solid rgba(31,41,55,0.75);
      text-align:left;
      vertical-align: middle;
    }
    th{
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(2,6,23,0.35);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr.playerRow{
      cursor: pointer;
      user-select:none;
      transition: background .08s ease, border-color .08s ease;
    }

    tr.playerRow:hover{
      background: rgba(148,163,184,0.06);
    }

    tr.playerRow.inGame{
      background: var(--inBlueBg);
      outline: 1px solid var(--inBlueBorder);
    }
    tr.playerRow.inGame td{
      color: var(--inBlueText);
    }

    .num{
      width: 70px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .status{
      width: 110px;
      font-size: .82rem;
      color: var(--muted);
    }

    .status .dot{
      display:inline-block;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      margin-right: 8px;
